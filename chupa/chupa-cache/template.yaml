AWSTemplateFormatVersion: "2010-09-09"
Description: "Chupa Stack 3/5 - Cache (VPC + ElastiCache Redis) [prod only / optional]"

# ════════════════════════════════════════════════════════════════
# 이 스택은 prod 에서만 배포한다 (dev 는 건너뛰어도 동작에 문제없음).
# 실제로 람다가 Redis 를 사용하기 시작하면 그 람다는 VPC 안에 들어가야 하고,
# 그러면 NAT Gateway 등 추가 비용이 발생한다.
# 현재 코드에서는 사용하지 않으므로 ‘인프라 준비용’ 정도의 의미.
# ════════════════════════════════════════════════════════════════

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "chupa-vpc-${Environment}"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "chupa-private-1-${Environment}"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "chupa-private-2-${Environment}"

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Lambda functions in VPC"
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Redis access from Lambda"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: "Chupa Redis subnet group"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub "chupa-redis-${Environment}"
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheNodes: 1
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      EngineVersion: "7.0"

Outputs:
  VpcId:
    Value: !Ref VPC
    Export: { Name: !Sub "chupa-${Environment}-VpcId" }

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export: { Name: !Sub "chupa-${Environment}-PrivateSubnet1" }

  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export: { Name: !Sub "chupa-${Environment}-PrivateSubnet2" }

  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export: { Name: !Sub "chupa-${Environment}-LambdaSG" }

  RedisEndpoint:
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
    Export: { Name: !Sub "chupa-${Environment}-RedisEndpoint" }

  RedisPort:
    Value: !GetAtt RedisCluster.RedisEndpoint.Port
    Export: { Name: !Sub "chupa-${Environment}-RedisPort" }
