AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Chupa Stack 1/5 - Foundation (Cognito, S3, CloudFront)"

# ════════════════════════════════════════════════════════════════
# 이 스택은 다른 스택들이 참조하는 ‘기반 리소스’를 만든다.
#  - Cognito User Pool (인증)
#  - S3 ImageBucket (프로필 사진 저장)
#  - CloudFront Distribution (이미지 CDN)
#  - SSM Parameter Store (Cognito ID 등 다른 스택/클라이언트가 참조)
#
# 카카오 OAuth 키는 Cognito IdP 설정에 직접 사용되어 이곳에 머문다.
# 카카오 Map API 키는 venue 람다에서만 쓰므로 API 스택으로 이동했다.
# ════════════════════════════════════════════════════════════════

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  KakaoClientId:
    Type: String
    Description: "Kakao OAuth Client ID (Cognito federated identity)"
    NoEcho: true

  KakaoClientSecret:
    Type: String
    Description: "Kakao OAuth Client Secret"
    NoEcho: true

  ProdCallbackUrl:
    Type: String
    Default: "https://app.chupa.kr/callback"
    Description: "Cognito OAuth callback URL (prod only)"

  ProdLogoutUrl:
    Type: String
    Default: "https://app.chupa.kr/logout"
    Description: "Cognito OAuth logout URL (prod only)"

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ════════════════════════════════════════
  # Cognito User Pool
  # ════════════════════════════════════════
  # ════════════════════════════════════════
  # 유저 프로비저닝 Lambda — 카카오 로그인 시 Users 테이블 레코드 자동 생성
  #   (리소스명은 PostConfirmation* 로 남아있으나 실제 트리거는 PostAuthentication.
  #    카카오=OIDC 페더레이션은 PostConfirmation 미발생이라 PostAuthentication 으로 연결.)
  # ════════════════════════════════════════
  PostConfirmationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutUser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                # database 스택보다 먼저 배포될 수 있으므로 ImportValue 대신 직접 참조
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chupa-users-${Environment}"

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-post-confirmation-${Environment}"
      CodeUri: ../lambda/functions/postConfirmation/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Timeout: 10
      Role: !GetAtt PostConfirmationRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Sub "chupa-users-${Environment}"
      Tags:
        Project: chupa
        Environment: !Ref Environment

  PostConfirmationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-post-confirmation-${Environment}"
      RetentionInDays: 7

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolName: !Sub "chupa-users-${Environment}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: birthdate
          AttributeDataType: String
          Mutable: true
          Required: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        # 카카오(OIDC 페더레이션) 로그인은 PostConfirmation 이 발생하지 않으므로
        #   매 로그인마다 발생하는 PostAuthentication 으로 Users 레코드 생성을 보장.
        PostAuthentication: !GetAtt PostConfirmationFunction.Arn
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UserPoolTags:
        Project: chupa
        Environment: !Ref Environment

  KakaoIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Kakao
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref KakaoClientId
        client_secret: !Ref KakaoClientSecret
        authorize_scopes: "openid profile_nickname profile_image account_email"
        oidc_issuer: "https://kauth.kakao.com"
        attributes_request_method: GET
      AttributeMapping:
        email: email
        name: nickname
        picture: profile_image_url

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "chupa-app-${Environment}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      # SupportedIdentityProviders 의 !Ref 가 KakaoIdentityProvider 생성 순서를 자동 보장
      SupportedIdentityProviders:
        - COGNITO
        - !Ref KakaoIdentityProvider
      # dev 환경에서는 다음 url 을 콘솔에서 직접 등록해주자.
      # [chupa://callback (standalone 빌드용), exp://192.168.x.x:8081/--/callback (Expo Go 실기기용), exp://localhost:8081/--/callback (Expo Go 시뮬레이터용)]
      CallbackURLs:
        - !If [IsProd, !Ref ProdCallbackUrl, "exp://localhost:8081/callback"]
      LogoutURLs:
        - !If [IsProd, !Ref ProdLogoutUrl, "exp://localhost:8081/logout"]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "chupa-auth-${Environment}"
      UserPoolId: !Ref UserPool

  # ════════════════════════════════════════
  # S3 - 프로필 이미지 저장
  # ════════════════════════════════════════
  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub "chupa-images-${Environment}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempUploads
            Prefix: temp/
            Status: Enabled
            ExpirationInDays: 1

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ImageBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ════════════════════════════════════════
  # CloudFront - 이미지 CDN
  # ════════════════════════════════════════
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "chupa-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Chupa Images CDN (${Environment})"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingOptimized
          Compress: true
          AllowedMethods: [GET, HEAD]
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ImageBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOAC
        PriceClass: PriceClass_200

  # ════════════════════════════════════════
  # SSM Parameter Store
  # 클라이언트 앱이 동적으로 읽어가야 하는 값들만 저장.
  # (다른 스택들은 ImportValue 로 직접 받으므로 SSM 불필요)
  # ════════════════════════════════════════
  ParamUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cognito/userPoolId"
      Type: String
      Value: !Ref UserPool

  ParamUserPoolClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cognito/clientId"
      Type: String
      Value: !Ref UserPoolClient

  ParamCdnDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cloudfront/domain"
      Type: String
      Value: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolArn"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolClientId"

  ImageBucketName:
    Value: !Ref ImageBucket
    Export:
      Name: !Sub "chupa-${Environment}-ImageBucket"

  ImageBucketArn:
    Value: !GetAtt ImageBucket.Arn
    Export:
      Name: !Sub "chupa-${Environment}-ImageBucketArn"

  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "chupa-${Environment}-CdnDomain"

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "chupa-${Environment}-CdnDistId"
