AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Chupa Stack 1/5 - Foundation (Cognito, S3, CloudFront)"

# ════════════════════════════════════════════════════════════════
# 이 스택은 다른 스택들이 참조하는 ‘기반 리소스’를 만든다.
#  - Cognito User Pool (인증)
#  - S3 ImageBucket (프로필 사진 저장)
#  - CloudFront Distribution (이미지 CDN)
#  - SSM Parameter Store (Cognito ID 등 다른 스택/클라이언트가 참조)
#
# 카카오 OAuth 키는 Cognito IdP 설정에 직접 사용되어 이곳에 머문다.
# 카카오 Map API 키는 venue 람다에서만 쓰므로 API 스택으로 이동했다.
# ════════════════════════════════════════════════════════════════

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  KakaoClientId:
    Type: String
    Description: "Kakao OAuth Client ID (Cognito federated identity)"
    NoEcho: true

  KakaoClientSecret:
    Type: String
    Description: "Kakao OAuth Client Secret"
    NoEcho: true

  # ── Apple 로그인(Sign in with Apple) ───────────────────────────
  # 네 값이 모두 Apple Developer 콘솔 수동 발급물이다. 비어있으면(기본값 "")
  # IdP 를 만들지 않는다(HasAppleConfig 조건) → 값 없이도 dev 배포가 깨지지 않음.
  # 값이 준비되면 배포 시 --parameter-overrides 로 주입한다.
  AppleServicesId:
    Type: String
    Default: ""
    Description: "Apple Services ID = Cognito client_id (예: kr.chupa.signin)"

  AppleTeamId:
    Type: String
    Default: ""
    Description: "Apple Developer Team ID (10자)"

  AppleKeyId:
    Type: String
    Default: ""
    Description: "Sign in with Apple 용 private key 의 Key ID (10자)"

  ApplePrivateKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Apple private key(.p8) 본문 (-----BEGIN PRIVATE KEY----- 포함, 개행 유지)"

  ProdCallbackUrl:
    Type: String
    Default: "https://app.chupa.kr/callback"
    Description: "Cognito OAuth callback URL (prod only)"

  ProdLogoutUrl:
    Type: String
    Default: "https://app.chupa.kr/logout"
    Description: "Cognito OAuth logout URL (prod only)"

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  # Apple Services ID 가 주입됐을 때만 Apple IdP 를 생성/연결한다.
  HasAppleConfig: !Not [!Equals [!Ref AppleServicesId, ""]]

Resources:
  # ════════════════════════════════════════
  # Cognito User Pool
  # ════════════════════════════════════════
  # ════════════════════════════════════════
  # 유저 프로비저닝 Lambda — 카카오 로그인 시 Users 테이블 레코드 자동 생성
  #   (리소스명은 PostConfirmation* 로 남아있으나 실제 트리거는 PostAuthentication.
  #    카카오=OIDC 페더레이션은 PostConfirmation 미발생이라 PostAuthentication 으로 연결.)
  # ════════════════════════════════════════
  PostConfirmationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutUser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                # database 스택보다 먼저 배포될 수 있으므로 ImportValue 대신 직접 참조
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chupa-users-${Environment}"

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-post-confirmation-${Environment}"
      CodeUri: ../lambda/functions/postConfirmation/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      Timeout: 10
      Role: !GetAtt PostConfirmationRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Sub "chupa-users-${Environment}"
      Tags:
        Project: chupa
        Environment: !Ref Environment

  PostConfirmationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-post-confirmation-${Environment}"
      RetentionInDays: 7

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolName: !Sub "chupa-users-${Environment}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: birthdate
          AttributeDataType: String
          Mutable: true
          Required: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        # 카카오(OIDC 페더레이션) 로그인은 PostConfirmation 이 발생하지 않으므로
        #   매 로그인마다 발생하는 PostAuthentication 으로 Users 레코드 생성을 보장.
        PostAuthentication: !GetAtt PostConfirmationFunction.Arn
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UserPoolTags:
        Project: chupa
        Environment: !Ref Environment

  KakaoIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Kakao
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref KakaoClientId
        client_secret: !Ref KakaoClientSecret
        authorize_scopes: "openid profile_nickname profile_image account_email"
        oidc_issuer: "https://kauth.kakao.com"
        attributes_request_method: GET
      AttributeMapping:
        email: email
        name: nickname
        picture: profile_image_url

  # ════════════════════════════════════════
  # Apple 로그인 IdP (Sign in with Apple)
  #   ⚠️ 클라는 provider 이름을 정확히 "SignInWithApple" 로 기대한다.
  #      Cognito 의 SignInWithApple 타입은 ProviderName 이 항상 "SignInWithApple" 로
  #      고정되므로 이 기대가 자동 충족된다.
  #   Apple Services ID 등 크레덴셜이 비어있으면 이 리소스를 만들지 않는다(HasAppleConfig).
  # ════════════════════════════════════════
  AppleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasAppleConfig
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        client_id: !Ref AppleServicesId   # Apple Services ID
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: "email name"    # Apple 이 지원하는 scope (name 은 최초 1회만 제공)
      AttributeMapping:
        # Apple 의 name 클레임은 최초 인증 1회만, 구조화 객체로 와서 매핑이 불안정 → email 만 매핑.
        email: email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "chupa-app-${Environment}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      # SupportedIdentityProviders 의 !Ref 가 각 IdP 생성 순서를 자동 보장.
      #   Apple 은 크레덴셜이 주입된 경우(HasAppleConfig)에만 목록에 포함한다.
      #   (Fn::If 는 선택된 분기만 평가하므로 false 일 때 AppleIdentityProvider 참조 오류 없음.)
      SupportedIdentityProviders: !If
        - HasAppleConfig
        - [COGNITO, !Ref KakaoIdentityProvider, !Ref AppleIdentityProvider]
        - [COGNITO, !Ref KakaoIdentityProvider]
      # chupa://callback (standalone/Apple 로그인용) 은 IaC 로 고정 등록.
      # dev 의 Expo Go 실기기 url(exp://192.168.x.x:8081/--/callback) 은 콘솔에서 추가.
      CallbackURLs:
        - !If [IsProd, !Ref ProdCallbackUrl, "exp://localhost:8081/callback"]
        - "chupa://callback"
      LogoutURLs:
        - !If [IsProd, !Ref ProdLogoutUrl, "exp://localhost:8081/logout"]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "chupa-auth-${Environment}"
      UserPoolId: !Ref UserPool

  # ════════════════════════════════════════
  # S3 - 프로필 이미지 저장
  # ════════════════════════════════════════
  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub "chupa-images-${Environment}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempUploads
            Prefix: temp/
            Status: Enabled
            ExpirationInDays: 1

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ImageBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ════════════════════════════════════════
  # CloudFront - 이미지 CDN
  # ════════════════════════════════════════
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "chupa-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Chupa Images CDN (${Environment})"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"  # CachingOptimized
          Compress: true
          AllowedMethods: [GET, HEAD]
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ImageBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOAC
        PriceClass: PriceClass_200

  # ════════════════════════════════════════
  # SSM Parameter Store
  # 클라이언트 앱이 동적으로 읽어가야 하는 값들만 저장.
  # (다른 스택들은 ImportValue 로 직접 받으므로 SSM 불필요)
  # ════════════════════════════════════════
  ParamUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cognito/userPoolId"
      Type: String
      Value: !Ref UserPool

  ParamUserPoolClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cognito/clientId"
      Type: String
      Value: !Ref UserPoolClient

  ParamCdnDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/chupa/${Environment}/cloudfront/domain"
      Type: String
      Value: !GetAtt CloudFrontDistribution.DomainName

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolArn"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "chupa-${Environment}-UserPoolClientId"

  ImageBucketName:
    Value: !Ref ImageBucket
    Export:
      Name: !Sub "chupa-${Environment}-ImageBucket"

  ImageBucketArn:
    Value: !GetAtt ImageBucket.Arn
    Export:
      Name: !Sub "chupa-${Environment}-ImageBucketArn"

  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "chupa-${Environment}-CdnDomain"

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "chupa-${Environment}-CdnDistId"
