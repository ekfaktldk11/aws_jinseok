AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Chupa Stack 4/5 - API (REST API Gateway + Lambda + Push Topic)"

# ════════════════════════════════════════════════════════════════
# 이 스택이 만드는 것:
#   1. PushNotificationTopic (SNS) — chupa/chat 람다가 publish, realtime의 notification 람다가 subscribe
#   2. REST API Gateway + 6개 람다 (user/venue/checkin/chupa/match/report)
#   3. Lambda 실행 IAM Role
#   4. CORS 설정 (dev 는 *, prod 는 명시적 도메인 허용)
#
# 공유 코드(utils)는 각 함수 폴더의 shared.js 로 포함된다 (Layer 미사용).
# 카카오 Map API 키는 여기서만 사용되므로 이 스택의 Parameter 로 받음.
# ════════════════════════════════════════════════════════════════

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  KakaoMapApiKey:
    Type: String
    Description: "Kakao Map REST API Key (used by venue lambda)"
    NoEcho: true

  ProdAllowedOrigin:
    Type: String
    Default: "https://app.chupa.kr"
    Description: "CORS origin for prod (ignored in dev)"

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: "CloudWatch Logs retention in days"

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Architectures:
      - arm64                              # arm64 가 x86 보다 약 20% 저렴
    LoggingConfig:
      LogFormat: JSON                      # 구조화 로깅
    Tags:
      Project: chupa
      Environment: !Ref Environment
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        KAKAO_MAP_API_KEY: !Ref KakaoMapApiKey
        PUSH_TOPIC_ARN: !Ref PushNotificationTopic
        USER_POOL_ID: !ImportValue          # 계정 삭제(AdminDeleteUser)용
          Fn::Sub: "chupa-${Environment}-UserPoolId"
        USERS_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-UsersTable"
        CHECKINS_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-CheckInsTable"
        VENUE_CACHE_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-VenueCacheTable"
        CHUPAS_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-ChupasTable"
        MATCHES_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-MatchesTable"
        REPORTS_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-ReportsTable"
        MESSAGES_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-MessagesTable"
        DEVICES_TABLE: !ImportValue
          Fn::Sub: "chupa-${Environment}-DevicesTable"
        IMAGE_BUCKET: !ImportValue
          Fn::Sub: "chupa-${Environment}-ImageBucket"
        CDN_DOMAIN: !ImportValue
          Fn::Sub: "chupa-${Environment}-CdnDomain"

Resources:
  # ════════════════════════════════════════
  # PushNotificationTopic — 모든 푸시 이벤트 진입점
  # publish: chupa, chat (sendMessage) 람다
  # subscribe: realtime 스택의 NotificationFunction
  # ════════════════════════════════════════
  PushNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "chupa-push-${Environment}"

  # ════════════════════════════════════════
  # REST API Gateway
  # ════════════════════════════════════════
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "chupa-api-${Environment}"
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !If
          - IsProd
          - !Sub "'${ProdAllowedOrigin}'"
          - "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !ImportValue
              Fn::Sub: "chupa-${Environment}-UserPoolArn"
        AddDefaultAuthorizerToCorsPreflight: false
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: !If [IsProd, false, true]
          LoggingLevel: INFO
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/chupa-api-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # ════════════════════════════════════════
  # Lambda 실행 IAM Role
  # RoleName 명시 X — 동일 계정에서 dev/prod 충돌 방지
  # ════════════════════════════════════════
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-UsersTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-UsersTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-CheckInsTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-CheckInsTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-VenueCacheTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-ChupasTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-ChupasTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-MatchesTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-MatchesTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-ReportsTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-ReportsTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-MessagesTableArn"
                  - !ImportValue
                    Fn::Sub: "chupa-${Environment}-DevicesTableArn"
                  - !Sub
                    - "${T}/index/*"
                    - T: !ImportValue
                        Fn::Sub: "chupa-${Environment}-DevicesTableArn"
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub
                  - "${B}/*"
                  - B: !ImportValue
                      Fn::Sub: "chupa-${Environment}-ImageBucketArn"
        - PolicyName: SnsPublishAccess
          # 모든 API 람다에 푸시 발송 권한 부여 (단순함 우선).
          # 추후 chupa/chat 만으로 좁히고 싶으면 별도 IAM::Policy 로 분리하면 됨.
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref PushNotificationTopic
        - PolicyName: CognitoDeleteUser
          # DELETE /users/{userId} 계정 삭제 시 Cognito 유저 제거.
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cognito-idp:AdminDeleteUser
                Resource: !ImportValue
                  Fn::Sub: "chupa-${Environment}-UserPoolArn"

  # ════════════════════════════════════════
  # Lambda Functions
  # ════════════════════════════════════════
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-user-${Environment}"
      CodeUri: ../lambda/functions/user/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}
            Method: GET
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}
            Method: PUT
        DeleteAccount:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}
            Method: DELETE
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}/upload-url
            Method: POST
        GetMyStats:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/me/stats
            Method: GET
        GetBlocks:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}/blocks
            Method: GET
        UnblockUser:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}/block
            Method: DELETE

  UserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-user-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  VenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-venue-${Environment}"
      CodeUri: ../lambda/functions/venue/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        SearchNearby:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /venues/nearby
            Method: POST
        GetVenue:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /venues/{venueId}
            Method: GET
        ReverseGeocode:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /geocode/reverse
            Method: GET

  VenueFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-venue-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  CheckInFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-checkin-${Environment}"
      CodeUri: ../lambda/functions/checkin/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        CreateCheckIn:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /checkins
            Method: POST
        DeleteCheckIn:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /checkins/{venueId}
            Method: DELETE
        GetVenueUsers:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /checkins/venue/{venueId}
            Method: GET
        GetMyCheckIn:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /checkins/me
            Method: GET

  CheckInFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-checkin-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  ChupaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-chupa-${Environment}"
      CodeUri: ../lambda/functions/chupa/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        SendChupa:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /chupas
            Method: POST
        GetReceivedChupas:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /chupas/received
            Method: GET
        GetSentChupas:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /chupas/sent
            Method: GET

  ChupaFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-chupa-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-match-${Environment}"
      CodeUri: ../lambda/functions/match/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        GetMatches:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /matches
            Method: GET
        GetMatch:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /matches/{matchId}
            Method: GET
        GetMatchMessages:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /matches/{matchId}/messages
            Method: GET

  MatchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-match-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-report-${Environment}"
      CodeUri: ../lambda/functions/report/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        CreateReport:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /reports
            Method: POST
        BlockUser:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /users/{userId}/block
            Method: POST

  ReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-report-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  DeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "chupa-device-${Environment}"
      CodeUri: ../lambda/functions/device/
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        RegisterDevice:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /devices
            Method: POST
        UnregisterDevice:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /devices
            Method: DELETE

  DeviceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/chupa-device-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "chupa-${Environment}-ApiUrl"

  RestApiId:
    Value: !Ref RestApi
    Export:
      Name: !Sub "chupa-${Environment}-RestApiId"

  PushTopicArn:
    Value: !Ref PushNotificationTopic
    Description: "Realtime 스택의 NotificationFunction 이 subscribe"
    Export:
      Name: !Sub "chupa-${Environment}-PushTopicArn"
